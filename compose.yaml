services:
  hamcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - MCP_ADDR=${MCP_ADDR:-0.0.0.0:3000}
    healthcheck:
      test: ["CMD", "/hamcp-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
